<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Мой сайт{% endblock %}</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
    }
    #sidebar {
      min-width: 250px;
      max-width: 250px;
      background-color: #f8f9fa;
      padding-top: 1rem;
    }
    #sidebar .nav-link {
      font-size: 1.1rem;
    }
    #content {
      flex: 1;
      padding: 2rem;
    }
  </style>
</head>
<body>

<!-- Боковое меню -->
<nav id="sidebar" class="d-flex flex-column">
  <h4 class="text-center mb-4">Меню</h4>
  <ul class="nav nav-pills flex-column mb-auto px-3">
    <li class="nav-item">
      <a href="/" class="nav-link {% if request.path=='/' %}active{% endif %}">Главная</a>
    </li>
    <li>
      <a href="/categories" class="nav-link {% if request.path=='/categories' %}active{% endif %}">Категории</a>
    </li>
    <li>
      <a href="/products" class="nav-link {% if request.path=='/products' %}active{% endif %}">Товары</a>
    </li>
    <li>
      <a href="/contacts" class="nav-link {% if request.path=='/contacts' %}active{% endif %}">Контакты</a>
    </li>
  </ul>
</nav>

<!-- Основной контент -->
<div id="content">
  {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
