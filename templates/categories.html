{% extends "base.html" %}

{% block title %}Категории{% endblock %}

{% block content %}
<div class="row py-lg-5">
    <div class="col-lg-6 col-md-8 mx-auto text-center">
        <h1 class="fw-bold">Категория</h1>
    </div>
</div>

<div class="container">
    <!-- Первая строка -->
    <div class="row mb-4">
        {% for i in range(2) %}
        <div class="col-md-6">
            <div class="card shadow-sm">
                <svg aria-label="Placeholder: Thumbnail"
                     class="bd-placeholder-img card-img-top"
                     height="225"
                     preserveAspectRatio="xMidYMid slice"
                     role="img"
                     width="100%"
                     xmlns="http://www.w3.org/2000/svg">
                    <title>Placeholder</title>
                    <rect width="100%" height="100%" fill="#55595c"></rect>
                    <text x="50%" y="50%" fill="#eceeef" dy=".3em">Thumbnail</text>
                </svg>
                <div class="card-body">
                    <p class="card-text">Это короткий текст для блока.</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <!-- Вторая строка -->
    <div class="row">
        {% for i in range(2) %}
        <div class="col-md-6">
            <div class="card shadow-sm">
                <svg aria-label="Placeholder: Thumbnail"
                     class="bd-placeholder-img card-img-top"
                     height="225"
                     preserveAspectRatio="xMidYMid slice"
                     role="img" width="100%"
                     xmlns="http://www.w3.org/2000/svg">
                    <title>Placeholder</title>
                    <rect width="100%" height="100%" fill="#55595c"></rect>
                    <text x="50%" y="50%" fill="#eceeef" dy=".3em">Thumbnail</text>
                </svg>
                <div class="card-body">
                    <p class="card-text">Это короткий текст для блока.</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
